<!DOCTYPE html>
<html>
<head>
    <title>EventHub - Upcoming Events</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; text-align: center; }
        .event-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .event-card { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            width: 300px; 
            transition: transform 0.2s;
        }
        .event-card:hover { transform: translateY(-5px); }
        .event-card h3 { margin-top: 0; color: #007bff; }
        .event-card p { color: #555; }
        .btn { 
            background: #007bff; 
            color: white; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 4px; 
            display: inline-block; 
            margin-top: 10px;
        }
        .btn:hover { background: #0056b3; }
        .no-events { text-align: center; color: #777; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>📅 Upcoming Events</h1>
    <div class="event-grid">
        {% for event in events %}
        <div class="event-card">
            <h3>{{ event.title }}</h3>
            <p><strong>📆 Date:</strong> {{ event.date }} at {{ event.time }}</p>
            <p><strong>📍 Venue:</strong> {{ event.venue }}</p>
            <p>{{ event.description|truncatechars:100 }}</p>
            <a href="{% url 'event_detail' event.id %}" class="btn">View Details →</a>
        </div>
        {% empty %}
        <p class="no-events">No events available at this time. Please check back later!</p>
        {% endfor %}
    </div>
</body>
</html>
